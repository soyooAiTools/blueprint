<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分镜预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d0d1a; color: #ddd; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; }
.header { text-align: center; margin-bottom: 24px; }
.header h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
.header .subtitle { font-size: 13px; color: #888; }
.sb-table { width: 100%; border-collapse: collapse; background: #12122a; border-radius: 10px; overflow: hidden; }
.sb-th { background: #1a1a3a; color: #aaa; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 12px 10px; text-align: left; border-bottom: 2px solid #2a2a4a; }
.sb-th-num { width: 50px; text-align: center; }
.sb-th-desc { width: 40%; }
.sb-th-visual { width: 30%; text-align: center; }
.sb-th-script { width: 25%; }
.sb-tr { border-bottom: 1px solid #1a1a3a; }
.sb-tr:hover { background: rgba(99,102,241,0.04); }
.sb-td { padding: 14px 10px; vertical-align: top; }
.sb-td-num { text-align: center; vertical-align: middle; }
.sb-num { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: #1e1e3a; color: #6366f1; font-weight: 700; font-size: 14px; }
.sb-phase { font-size: 14px; font-weight: 600; color: #e0e0ff; margin-bottom: 8px; }
.sb-field-row { margin-bottom: 6px; }
.sb-field-key { font-size: 11px; color: #888; font-weight: 600; display: block; margin-bottom: 2px; }
.sb-field-val { font-size: 13px; color: #ccc; line-height: 1.6; white-space: pre-wrap; }
.sb-td-visual { text-align: center; vertical-align: middle; }
.sb-visual-img { max-width: 100%; max-height: 240px; border-radius: 6px; border: 1px solid #2a2a4a; cursor: pointer; transition: transform 0.15s; }
.sb-visual-img:hover { transform: scale(1.03); box-shadow: 0 0 12px rgba(99,102,241,0.4); }
.sb-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px; color: #444; font-size: 24px; font-weight: 700; }
.sb-placeholder-text { font-size: 11px; color: #555; font-weight: 400; margin-top: 4px; }
.sb-script-col { font-size: 12px; color: #888; line-height: 1.6; white-space: pre-wrap; background: #0d0d1a; border-radius: 4px; padding: 8px; border-left: 3px solid #4a4a6a; }
.sb-chapter-divider { background: #1a1a3a; }
.sb-chapter-divider td { padding: 8px 14px; font-size: 13px; font-weight: 600; color: #6366f1; letter-spacing: 0.5px; }
/* Lightbox */
.lightbox { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; cursor: pointer; }
.lightbox.active { display: flex; }
.lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 8px; }
.lightbox-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; }
.lightbox-btn { background: #1e1e3a; border: 1px solid #444; border-radius: 6px; color: #ddd; padding: 8px 20px; cursor: pointer; font-size: 14px; text-decoration: none; }
.lightbox-btn:hover { background: #2a2a4a; border-color: #6366f1; color: #fff; }
.loading { text-align: center; padding: 60px; color: #888; font-size: 16px; }
.watermark { text-align: center; margin-top: 32px; color: #333; font-size: 11px; }
@media print {
  body { background: #fff; color: #222; padding: 12px; }
  .sb-table { background: #fff; }
  .sb-th { background: #f0f0f0; color: #555; border-bottom: 2px solid #ccc; }
  .sb-tr { border-bottom: 1px solid #eee; }
  .sb-num { background: #f0f0f0; color: #6366f1; }
  .sb-field-key { color: #666; }
  .sb-field-val { color: #333; }
  .sb-script-col { background: #f8f8f8; border-left-color: #ccc; color: #555; }
  .sb-visual-img { max-height: 180px; }
  .watermark { display: none; }
}
</style>
</head>
<body>
<div class="header">
  <h1 id="title">分镜预览</h1>
  <div class="subtitle" id="subtitle"></div>
</div>
<div id="content"><div class="loading">加载中...</div></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-bar">
    <a id="lightbox-dl" class="lightbox-btn" href="" download="frame.jpg" onclick="event.stopPropagation()">⬇️ 下载</a>
    <button class="lightbox-btn" onclick="closeLightbox()">✕ 关闭</button>
  </div>
</div>
<div class="watermark">Generated by Blueprint Editor</div>
<script>
// Resolve API base: strip filename, keep directory (e.g. /blueprint/)
var API_BASE = location.pathname.replace(/\/[^/]*$/, '');
var params = new URLSearchParams(location.search);
var projectId = params.get('id');

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-dl').href = url;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function render(proj) {
  document.getElementById('title').textContent = (proj.name || '项目') + ' — 分镜预览';
  document.getElementById('subtitle').textContent = '共 ' + (proj.storyboardFrames || []).length + ' 帧 · ' + new Date().toLocaleDateString('zh-CN');
  var frames = proj.storyboardFrames || [];
  if (frames.length === 0) { document.getElementById('content').innerHTML = '<div class="loading">暂无分镜数据</div>'; return; }

  var html = '<table class="sb-table"><thead><tr>';
  html += '<th class="sb-th sb-th-num">序号</th>';
  html += '<th class="sb-th sb-th-desc">文字描述</th>';
  html += '<th class="sb-th sb-th-visual">画面</th>';
  html += '<th class="sb-th sb-th-script">原脚本文案</th>';
  html += '</tr></thead><tbody>';

  var lastChapter = null;
  frames.forEach(function(f, i) {
    if (f.chapter && f.chapter !== lastChapter) {
      lastChapter = f.chapter;
      html += '<tr class="sb-chapter-divider"><td colspan="4">📋 第' + f.chapter + '章：' + esc(f.chapterTitle || '') + '</td></tr>';
    }
    html += '<tr class="sb-tr">';
    html += '<td class="sb-td sb-td-num"><span class="sb-num">' + (i + 1) + '</span></td>';
    // 文字描述
    html += '<td class="sb-td sb-td-desc">';
    html += '<div class="sb-phase">' + esc(f.title || '镜头' + (i+1)) + '</div>';
    if (f.scene) html += '<div class="sb-field-row"><span class="sb-field-key">玩家看到什么：</span><span class="sb-field-val">' + esc(f.scene) + '</span></div>';
    if (f.interaction) html += '<div class="sb-field-row"><span class="sb-field-key">玩家做什么：</span><span class="sb-field-val">' + esc(f.interaction) + '</span></div>';
    if (f.camera) html += '<div class="sb-field-row"><span class="sb-field-key">镜头：</span><span class="sb-field-val">' + esc(f.camera) + '</span></div>';
    if (f.feeling) html += '<div class="sb-field-row"><span class="sb-field-key">感觉：</span><span class="sb-field-val">' + esc(f.feeling) + '</span></div>';
    if (f.duration || f.timing) html += '<div class="sb-field-row"><span class="sb-field-key">大约耗时：</span><span class="sb-field-val">' + esc(f.duration || f.timing) + '</span></div>';
    html += '</td>';
    // 画面
    html += '<td class="sb-td sb-td-visual">';
    if (f.imageUrl) {
      var imgSrc = API_BASE + f.imageUrl;
      html += '<img class="sb-visual-img" src="' + imgSrc + '" alt="' + esc(f.title) + '" onclick="openLightbox(\'' + imgSrc + '\')">';
    } else {
      html += '<div class="sb-placeholder"><span>#' + (i+1) + '</span><span class="sb-placeholder-text">待生成</span></div>';
    }
    html += '</td>';
    // 原脚本文案
    html += '<td class="sb-td">';
    if (f.scriptExcerpt) html += '<div class="sb-script-col">' + esc(f.scriptExcerpt) + '</div>';
    else html += '<span style="color:#444">—</span>';
    html += '</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}

if (!projectId) {
  document.getElementById('content').innerHTML = '<div class="loading">缺少项目ID参数 (?id=xxx)</div>';
} else {
  fetch(API_BASE + '/api/projects/' + projectId)
    .then(function(r) { return r.json(); })
    .then(render)
    .catch(function(e) { document.getElementById('content').innerHTML = '<div class="loading">加载失败: ' + e.message + '</div>'; });
}
</script>
</body>
</html>
