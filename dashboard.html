<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }
.header { background: #161b22; padding: 16px 24px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; font-weight: 600; }
.header .status { font-size: 13px; color: #8b949e; }
.tabs { display: flex; background: #161b22; border-bottom: 1px solid #30363d; padding: 0 16px; overflow-x: auto; }
.tab { padding: 10px 16px; cursor: pointer; font-size: 13px; color: #8b949e; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; }
.tab:hover { color: #e1e4e8; }
.tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
.content { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.card h3 { font-size: 14px; color: #8b949e; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.probes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.probe { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; display: flex; align-items: center; gap: 10px; }
.probe .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.probe .dot.ok { background: #3fb950; box-shadow: 0 0 6px #3fb95066; }
.probe .dot.warn { background: #d29922; box-shadow: 0 0 6px #d2992266; }
.probe .dot.down { background: #f85149; box-shadow: 0 0 6px #f8514966; }
.probe .dot.unknown { background: #484f58; }
.probe .name { font-size: 13px; font-weight: 500; }
.probe .status-text { font-size: 11px; color: #8b949e; margin-left: auto; text-transform: uppercase; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 14px; text-align: center; }
.stat .val { font-size: 28px; font-weight: 700; color: #58a6ff; }
.stat .label { font-size: 11px; color: #8b949e; margin-top: 4px; text-transform: uppercase; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; color: #8b949e; font-weight: 500; border-bottom: 1px solid #30363d; font-size: 11px; text-transform: uppercase; }
td { padding: 8px 10px; border-bottom: 1px solid #21262d; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.badge.critical, .badge.error { background: #f8514933; color: #f85149; }
.badge.warning { background: #d2992233; color: #d29922; }
.badge.info { background: #58a6ff22; color: #58a6ff; }
.badge.ok, .badge.online { background: #3fb95022; color: #3fb950; }
.badge.idle { background: #484f5833; color: #8b949e; }
.empty { text-align: center; padding: 40px; color: #484f58; }
.refresh-info { font-size: 11px; color: #484f58; text-align: right; margin-top: 8px; }
</style>
</head>
<body>
<div class="header">
  <h1>📊 Blueprint Dashboard</h1>
  <div class="status" id="lastUpdate">加载中...</div>
</div>
<div class="tabs">
  <div class="tab active" data-panel="overview">总览</div>
  <div class="tab" data-panel="health">链路健康</div>
  <div class="tab" data-panel="alerts">告警</div>
  <div class="tab" data-panel="errors">错误上报</div>
  <div class="tab" data-panel="workers">Workers</div>
  <div class="tab" data-panel="tasks">任务</div>
</div>
<div class="content">
  <!-- Overview -->
  <div class="panel active" id="overview">
    <div class="stats" id="overviewStats"></div>
    <div class="card">
      <h3>链路探针</h3>
      <div class="probes" id="overviewProbes"></div>
    </div>
    <div class="card">
      <h3>最近告警</h3>
      <div id="overviewAlerts"></div>
    </div>
  </div>
  <!-- Health -->
  <div class="panel" id="health">
    <div class="card">
      <h3>探针状态</h3>
      <div class="probes" id="healthProbes"></div>
      <div class="refresh-info">每 30s 自动刷新</div>
    </div>
  </div>
  <!-- Alerts -->
  <div class="panel" id="alerts">
    <div class="card">
      <h3>告警记录</h3>
      <div id="alertsList"></div>
    </div>
  </div>
  <!-- Errors -->
  <div class="panel" id="errors">
    <div class="card">
      <h3>前端错误上报</h3>
      <div id="errorsList"></div>
    </div>
  </div>
  <!-- Workers -->
  <div class="panel" id="workers">
    <div class="card">
      <h3>Worker 列表</h3>
      <div id="workersList"></div>
    </div>
  </div>
  <!-- Tasks -->
  <div class="panel" id="tasks">
    <div class="card">
      <h3>任务队列</h3>
      <div id="tasksList"></div>
    </div>
  </div>
</div>
<script>
(function() {
  // Tab switching
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById(tab.dataset.panel).classList.add('active');
    });
  });

  function fmt(ts) {
    if (!ts) return '-';
    return new Date(ts).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });
  }

  function badge(level) {
    return '<span class="badge ' + (level || 'info') + '">' + (level || 'info') + '</span>';
  }

  function probeHTML(name, status) {
    return '<div class="probe"><div class="dot ' + status + '"></div><div class="name">' + name + '</div><div class="status-text">' + status + '</div></div>';
  }

  function tableHTML(headers, rows) {
    if (!rows || !rows.length) return '<div class="empty">暂无数据</div>';
    var h = '<table><thead><tr>' + headers.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>';
    h += rows.map(function(r) { return '<tr>' + r.map(function(c) { return '<td>' + (c || '-') + '</td>'; }).join('') + '</tr>'; }).join('');
    return h + '</tbody></table>';
  }

  var BASE = window.location.origin;

  function fetchJSON(url) {
    return fetch(BASE + url).then(function(r) { return r.json(); }).catch(function() { return null; });
  }

  async function refresh() {
    var health = await fetchJSON('/api/health');
    var alerts = await fetchJSON('/api/alerts');
    var errors = await fetchJSON('/api/errors');
    var workers = await fetchJSON('/api/workers');
    var tasks = await fetchJSON('/api/tasks');

    document.getElementById('lastUpdate').textContent = '更新: ' + fmt(Date.now());

    // Overview stats
    var statsHTML = '';
    if (health) {
      var probes = health.probes || {};
      var okCount = Object.values(probes).filter(function(v) { return v === 'ok'; }).length;
      statsHTML += '<div class="stat"><div class="val">' + okCount + '/' + Object.keys(probes).length + '</div><div class="label">探针正常</div></div>';
    }
    statsHTML += '<div class="stat"><div class="val">' + (alerts ? alerts.length : 0) + '</div><div class="label">告警</div></div>';
    statsHTML += '<div class="stat"><div class="val">' + (errors ? errors.length : 0) + '</div><div class="label">错误</div></div>';
    if (workers) {
      var onlineW = Array.isArray(workers) ? workers.filter(function(w) { return w.status === 'online' || (Date.now() - (w.lastSeen || 0) < 120000); }).length : 0;
      statsHTML += '<div class="stat"><div class="val">' + onlineW + '</div><div class="label">在线 Worker</div></div>';
    }
    document.getElementById('overviewStats').innerHTML = statsHTML;

    // Probes
    if (health && health.probes) {
      var probesHTML = '';
      for (var k in health.probes) probesHTML += probeHTML(k, health.probes[k]);
      document.getElementById('overviewProbes').innerHTML = probesHTML;
      document.getElementById('healthProbes').innerHTML = probesHTML;
    }

    // Alerts
    var alertRows = (alerts || []).slice(-20).reverse().map(function(a) {
      return [badge(a.level), a.title || '-', (a.detail || '').slice(0, 60), fmt(a.timestamp)];
    });
    var alertTable = tableHTML(['级别', '标题', '详情', '时间'], alertRows);
    document.getElementById('overviewAlerts').innerHTML = alertTable;
    document.getElementById('alertsList').innerHTML = tableHTML(['级别', '标题', '详情', '时间'],
      (alerts || []).slice(-50).reverse().map(function(a) {
        return [badge(a.level), a.title || '-', a.detail || '-', fmt(a.timestamp)];
      })
    );

    // Errors
    document.getElementById('errorsList').innerHTML = tableHTML(['类型', '消息', 'URL', '时间'],
      (errors || []).slice(-50).reverse().map(function(e) {
        return [e.type || 'error', (e.message || '').slice(0, 80), (e.url || '').slice(0, 40), fmt(e.timestamp)];
      })
    );

    // Workers
    if (Array.isArray(workers)) {
      document.getElementById('workersList').innerHTML = tableHTML(['名称', '状态', '当前任务', '最后心跳'],
        workers.map(function(w) {
          var st = (Date.now() - (w.lastSeen || w.timestamp || 0) < 120000) ? 'online' : 'offline';
          return [w.name || w.id || '-', badge(st), w.currentTask || '-', fmt(w.lastSeen || w.timestamp)];
        })
      );
    } else {
      document.getElementById('workersList').innerHTML = '<div class="empty">暂无 Worker 数据</div>';
    }

    // Tasks
    if (Array.isArray(tasks)) {
      document.getElementById('tasksList').innerHTML = tableHTML(['ID', '项目', '状态', '创建时间'],
        tasks.slice(0, 30).map(function(t) {
          return [(t.id || '').slice(0, 8), t.projectName || '-', badge(t.status || 'pending'), fmt(t.createdAt)];
        })
      );
    } else {
      document.getElementById('tasksList').innerHTML = '<div class="empty">暂无任务数据</div>';
    }
  }

  refresh();
  setInterval(refresh, 30000);
})();
</script>
</body>
</html>
