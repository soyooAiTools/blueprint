<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }
.header { background: #161b22; padding: 16px 24px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; font-weight: 600; }
.header .meta { display: flex; align-items: center; gap: 16px; font-size: 12px; color: #8b949e; }
.header .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.header .dot.ok { background: #3fb950; }
.header .dot.err { background: #f85149; }
.tabs { display: flex; background: #161b22; border-bottom: 1px solid #30363d; padding: 0 16px; overflow-x: auto; }
.tab { padding: 10px 16px; cursor: pointer; font-size: 13px; color: #8b949e; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; user-select: none; }
.tab:hover { color: #e1e4e8; }
.tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
.content { padding: 20px 24px; max-width: 1280px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; }
.grid { display: grid; gap: 16px; margin-bottom: 20px; }
.grid-4 { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.grid-2 { grid-template-columns: 1fr 1fr; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
.card h3 { font-size: 12px; color: #8b949e; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
.stat-card { text-align: center; padding: 20px 16px; }
.stat-card .val { font-size: 32px; font-weight: 700; line-height: 1.2; }
.stat-card .label { font-size: 11px; color: #8b949e; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
.stat-card .sub { font-size: 11px; color: #484f58; margin-top: 2px; }
.val.blue { color: #58a6ff; }
.val.green { color: #3fb950; }
.val.yellow { color: #d29922; }
.val.red { color: #f85149; }
.val.gray { color: #8b949e; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; color: #8b949e; font-weight: 500; border-bottom: 1px solid #30363d; font-size: 11px; text-transform: uppercase; }
td { padding: 8px 10px; border-bottom: 1px solid #21262d; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.badge.ok, .badge.online, .badge.idle, .badge.completed, .badge.done, .badge.cua_passed, .badge.approved, .badge.committed { background: #3fb95022; color: #3fb950; }
.badge.processing, .badge.developing, .badge.building, .badge.assigned, .badge.submitted, .badge.reviewing, .badge.busy, .badge.spec_extracting { background: #58a6ff22; color: #58a6ff; }
.badge.pending, .badge.fix_needed, .badge.editing { background: #d2992233; color: #d29922; }
.badge.failed, .badge.permanent_fail, .badge.offline { background: #f8514933; color: #f85149; }
.badge.cancelled { background: #48484822; color: #888; }
.badge.review_pass, .badge.quicktest_pass, .badge.cua_pass { background: #3fb95022; color: #3fb950; }
.badge.review_fail, .badge.quicktest_fail, .badge.cua_fail { background: #f8514933; color: #f85149; }
.badge.unknown { background: #484f5833; color: #8b949e; }
.empty { text-align: center; padding: 32px; color: #484f58; font-size: 13px; }
.refresh-info { font-size: 11px; color: #484f58; text-align: right; margin-top: 8px; }
.probe { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; }
.probe .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.probe .dot.ok { background: #3fb950; box-shadow: 0 0 6px #3fb95066; }
.probe .dot.error { background: #f85149; box-shadow: 0 0 6px #f8514966; }
.probe .dot.unknown { background: #484f58; }
.probe .name { font-size: 13px; font-weight: 500; flex: 1; }
.probe .latency { font-size: 11px; color: #8b949e; }
.flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.flow-step { text-align: center; }
.flow-step .count { font-size: 20px; font-weight: 700; }
.flow-step .lbl { font-size: 10px; color: #8b949e; text-transform: uppercase; }
.flow-arrow { color: #30363d; font-size: 18px; }
.history-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #21262d; font-size: 12px; }
.history-item:last-child { border-bottom: none; }
.history-item .icon { font-size: 14px; }
.history-item .time { color: #8b949e; margin-left: auto; white-space: nowrap; }
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: #30363d; }
.tl-item { position: relative; padding: 8px 0 8px 16px; font-size: 12px; }
.tl-item::before { content: ''; position: absolute; left: -20px; top: 14px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #30363d; background: #0d1117; }
.tl-item.ok::before { border-color: #3fb950; background: #3fb950; }
.tl-item.processing::before, .tl-item.building::before { border-color: #58a6ff; background: #58a6ff; }
.tl-item.failed::before, .tl-item.error::before { border-color: #f85149; background: #f85149; }
.tl-item.fixing::before { border-color: #d29922; background: #d29922; }
.tl-item.done::before, .tl-item.cua_passed::before { border-color: #3fb950; background: #3fb950; box-shadow: 0 0 6px #3fb95066; }
.tl-item .tl-msg { color: #e1e4e8; }
.tl-item .tl-time { color: #484f58; font-size: 11px; margin-top: 2px; }
.tl-item .tl-status { font-size: 10px; text-transform: uppercase; margin-left: 6px; }
.task-card { margin-bottom: 16px; }
.task-card .task-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.task-card .task-name { font-size: 15px; font-weight: 600; }
@media (max-width: 768px) {
  .grid-2 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="header">
  <h1>📊 Blueprint Dashboard</h1>
  <div class="meta">
    <span id="serverStatus"></span>
    <span id="lastUpdate">加载中...</span>
  </div>
</div>
<div class="tabs">
  <div class="tab active" data-panel="overview">总览</div>
  <div class="tab" data-panel="workers">Workers</div>
  <div class="tab" data-panel="tasks">任务队列</div>
  <div class="tab" data-panel="live">实时动态</div>
  <div class="tab" data-panel="quality">质量关卡</div>
  <div class="tab" data-panel="parse">解析统计</div>
  <div class="tab" data-panel="pipeline">Pipeline 指标</div>
</div>
<div class="content">
  <!-- Overview -->
  <div class="panel active" id="overview">
    <div class="grid grid-4" id="overviewStats"></div>
    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card">
        <h3>项目流转</h3>
        <div id="projectFlow"></div>
      </div>
      <div class="card">
        <h3>API 健康</h3>
        <div id="apiHealth" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h3>最近任务</h3>
      <div id="recentTasks"></div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h3>📋 项目链路日志（最近 10 步）</h3>
      <div id="pipelineLog"></div>
    </div>
  </div>
  <!-- Workers -->
  <div class="panel" id="workers">
    <div class="grid grid-4" id="workerStats"></div>
    <div class="card" style="margin-top:16px;">
      <h3>Worker 列表</h3>
      <div id="workerList"></div>
    </div>
  </div>
  <!-- Tasks -->
  <div class="panel" id="tasks">
    <div class="grid grid-4" id="taskStats"></div>
    <div class="card" style="margin-top:16px;">
      <h3>任务队列</h3>
      <div id="taskList"></div>
    </div>
  </div>
  <!-- Live Timeline -->
  <div class="panel" id="live">
    <div id="liveTimelines"></div>
    <div class="refresh-info">每 5 秒自动刷新</div>
  </div>
  <!-- Quality Gates -->
  <div class="panel" id="quality">
    <div class="grid grid-4" id="qualityStats"></div>
    <div class="card" style="margin-top:16px;">
      <h3>任务质量明细</h3>
      <div id="qualityDetail"></div>
    </div>
  </div>
  <!-- Parse Stats -->
  <div class="panel" id="parse">
    <div class="grid grid-4" id="parseStats"></div>
    <div class="card" style="margin-top:16px;">
      <h3>最近解析记录</h3>
      <div id="parseHistory"></div>
    </div>
  </div>
  <!-- Pipeline Metrics -->
  <div class="panel" id="pipeline">
    <div class="grid grid-4" id="pipelineTopStats"></div>
    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card">
        <h3>失败热点（按 Stage）</h3>
        <div id="failureHotspots"></div>
      </div>
      <div class="card">
        <h3>Stage 通过率</h3>
        <div id="stagePassRates"></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h3>Top 失败指纹（按 unique 任务数去重）<span id="pipelineDataWindow" style="float:right;font-size:11px;color:#8b949e;font-weight:normal;"></span></h3>
      <div id="topFailReasons"></div>
    </div>
    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card">
        <h3>趋势 &amp; 错误分类</h3>
        <div id="pipelineTrend"></div>
      </div>
      <div class="card">
        <h3>🚨 回归告警</h3>
        <div id="regressionAlerts"></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h3>项目失败明细</h3>
      <div id="projectFailures"></div>
    </div>
  </div>
</div>
<script>
(function() {
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById(tab.dataset.panel).classList.add('active');
    });
  });

  var BASE = window.location.origin;

  function fmt(ts) {
    if (!ts) return '-';
    var d = new Date(ts);
    return d.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
  function ago(ts) {
    if (!ts) return '-';
    var s = Math.round((Date.now() - ts) / 1000);
    if (s < 60) return s + '秒前';
    if (s < 3600) return Math.floor(s / 60) + '分钟前';
    if (s < 86400) return Math.floor(s / 3600) + '小时前';
    return Math.floor(s / 86400) + '天前';
  }
  function badge(level) { return '<span class="badge ' + (level || 'unknown') + '">' + (level || '-') + '</span>'; }

  function statCard(val, label, color, sub) {
    return '<div class="card stat-card"><div class="val ' + (color || 'blue') + '">' + val + '</div><div class="label">' + label + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }

  function tableHTML(headers, rows) {
    if (!rows || !rows.length) return '<div class="empty">暂无数据</div>';
    var h = '<table><thead><tr>' + headers.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>';
    h += rows.map(function(r) { return '<tr>' + r.map(function(c) { return '<td>' + (c != null ? c : '-') + '</td>'; }).join('') + '</tr>'; }).join('');
    return h + '</tbody></table>';
  }

  function fetchJSON(url) {
    return fetch(BASE + url).then(function(r) { return r.json(); }).catch(function() { return null; });
  }

  async function refresh() {
    var [stats, health, pipelineMetrics] = await Promise.all([
      fetchJSON('/api/dashboard/stats'),
      fetchJSON('/api/dashboard/api-health'),
      fetchJSON('/api/dashboard/pipeline-metrics')
    ]);

    document.getElementById('lastUpdate').textContent = '更新: ' + fmt(Date.now());

    if (!stats) {
      document.getElementById('overviewStats').innerHTML = '<div class="empty">无法连接服务器</div>';
      return;
    }

    // Server status in header
    var serverOk = health && health.server && health.server.status === 'ok';
    document.getElementById('serverStatus').innerHTML = '<span class="dot ' + (serverOk ? 'ok' : 'err') + '"></span>' + (serverOk ? '服务运行中 (' + (health.server.uptimeHuman || '?') + ')' : '服务异常');

    // ========== Overview ==========
    var ov = '';
    ov += statCard(stats.workers.online + '/' + stats.workers.total, 'Worker 在线', stats.workers.online > 0 ? 'green' : 'red');
    var activeTasks = (stats.tasks.processing || 0) + (stats.tasks.assigned || 0) + (stats.tasks.developing || 0) + (stats.tasks.building || 0);
    ov += statCard(activeTasks, '进行中任务', activeTasks > 0 ? 'blue' : 'gray');
    ov += statCard(stats.parse.successRate + '%', '解析成功率', stats.parse.successRate >= 80 ? 'green' : stats.parse.successRate >= 50 ? 'yellow' : 'red', '共 ' + stats.parse.total + ' 次');
    ov += statCard(stats.parse.avgTimeSec + 's', '平均解析耗时', 'blue', stats.parse.avgTimeSec > 180 ? '⚠️ 偏慢' : '');
    document.getElementById('overviewStats').innerHTML = ov;

    // Project flow
    var p = stats.projects;
    var flowSteps = [
      { count: p.editing || 0, lbl: '编辑中', color: 'yellow' },
      { count: p.submitted || 0, lbl: '已提交', color: 'blue' },
      { count: p.reviewing || 0, lbl: '审核中', color: 'blue' },
      { count: p.feedback || 0, lbl: '反馈中', color: 'purple' },
      { count: p.approved || 0, lbl: '已通过', color: 'green' },
      { count: p.committed || 0, lbl: '已入库', color: 'green' }
    ];
    var flowHTML = '<div style="text-align:center;margin-bottom:8px;font-size:12px;color:#8b949e;">共 ' + p.total + ' 个项目' + (p.failed ? '，<span style="color:#f85149;">' + p.failed + ' 个失败</span>' : '') + '</div>';
    flowHTML += '<div class="flow" style="justify-content:center;">';
    flowSteps.forEach(function(s, i) {
      if (i > 0) flowHTML += '<span class="flow-arrow">→</span>';
      flowHTML += '<div class="flow-step"><div class="count" style="color:var(--c)">' + s.count + '</div><div class="lbl">' + s.lbl + '</div></div>';
    });
    flowHTML += '</div>';
    document.getElementById('projectFlow').innerHTML = flowHTML;

    // API Health — show all 4 providers (豆包 / Claude / GPT-5.4 / Blueprint).
    // Backend returns `health.{doubao,claude,gpt54,server}` with shape:
    //   { status: 'ok'|'error', latencyMs: 123, error?: string }
    // We always render a placeholder for each so the user immediately sees
    // which providers exist (vs which are silently missing from the response).
    if (health) {
      function probeHTML(name, role, data, metricLabel) {
        var st = (data && data.status) || 'unknown';
        var dotCls = st === 'ok' ? 'ok' : (st === 'error' ? 'error' : 'unknown');
        // Use metricLabel if provided (e.g. uptime for the server probe),
        // otherwise fall back to latencyMs.
        var metric = metricLabel || (data && data.latencyMs != null ? data.latencyMs + 'ms' : '—');
        var err = data && data.error ? ' · <span style="color:#f85149;">' + data.error + '</span>' : '';
        return '<div class="probe">' +
          '<div class="dot ' + dotCls + '"></div>' +
          '<div class="name">' + name +
            '<div style="font-size:10px;color:#8b949e;font-weight:400;margin-top:1px;">' + role + '</div>' +
          '</div>' +
          '<div class="latency">' + metric + err + '</div>' +
          '</div>';
      }
      var ah = '';
      ah += probeHTML('豆包 Vision/Pro', 'CUA 视觉验证 + 文本生成', health.doubao);
      ah += probeHTML('Claude Opus 4.6', '主代码生成 (中转)', health.claude);
      ah += probeHTML('GPT-5.4', '代码审查 (Codex CLI)', health.gpt54);
      // Server probe shows uptime instead of a latency number.
      var serverUptime = '—';
      if (health.server && health.server.uptimeMs != null) {
        var s = Math.round(health.server.uptimeMs / 1000);
        if (s < 60) serverUptime = 'up ' + s + 's';
        else if (s < 3600) serverUptime = 'up ' + Math.floor(s / 60) + 'm';
        else serverUptime = 'up ' + Math.floor(s / 3600) + 'h' + Math.floor((s % 3600) / 60) + 'm';
      }
      ah += probeHTML('Blueprint 服务', '编辑器 + Worker 调度', health.server, serverUptime);
      // Surface healthCheck-level error (rare — the cache stores it when
      // the entire healthCheck() promise rejects, e.g. import failure)
      if (health.healthCheckError) {
        ah += '<div style="font-size:11px;color:#f85149;padding:6px 12px;">⚠ healthCheck error: ' + health.healthCheckError + '</div>';
      }
      // Cache freshness indicator (informational)
      if (health._cacheAgeMs != null) {
        var ageSec = Math.round(health._cacheAgeMs / 1000);
        var ageStr = ageSec < 60 ? ageSec + 's' : Math.round(ageSec / 60) + 'm';
        ah += '<div style="font-size:10px;color:#484f58;text-align:right;padding:2px 6px;">缓存于 ' + ageStr + ' 前</div>';
      }
      document.getElementById('apiHealth').innerHTML = ah || '<div class="empty">检测中...</div>';
    }

    // Recent tasks
    var rt = stats.recentTasks || [];
    document.getElementById('recentTasks').innerHTML = tableHTML(
      ['项目', '状态', '质量', '消息', '预览', 'Worker', '更新时间'],
      rt.slice(0, 5).map(function(t) {
        var preview = t.previewUrl ? '<a href="' + t.previewUrl + '" target="_blank" style="color:#58a6ff;">▶ 预览</a>' : '-';
        var qIcons = '';
        if (t.reviewResult === 'pass') qIcons += '📋✅';
        else if (t.reviewResult === 'fail') qIcons += '📋❌';
        if (t.quickTestResult === 'pass') qIcons += '🔍✅';
        else if (t.quickTestResult === 'fail') qIcons += '🔍❌';
        if (t.cuaResult === 'pass') qIcons += '🤖✅';
        else if (t.cuaResult === 'fail') qIcons += '🤖❌';
        if (!qIcons) qIcons = '-';
        return [t.projectName, badge(t.status), qIcons, (t.statusMessage || '').slice(0, 80), preview, t.workerId || '-', ago(t.updatedAt)];
      })
    );

    // Pipeline log — show latest 10 timeline entries from active/recent task
    var pipelineHTML = '';
    var activeTask = rt.length > 0 ? rt[0] : null;
    if (activeTask && activeTask.timeline && activeTask.timeline.length > 0) {
      var entries = activeTask.timeline.slice(-10);
      var statusIcons = {
        'pending': '⏳', 'assigned': '📋', 'processing': '🔧', 'building': '🔨',
        'built': '✅', 'cua_verifying': '🤖', 'completed': '🎉', 'failed': '❌',
        'developing': '💻', 'uploading': '📤',
        'code_review_pass': '📋✅', 'code_review_fail': '📋❌',
        'quicktest_fail': '🔍❌', 'quicktest_pass': '🔍✅',
        'cua_passed': '🤖✅', 'cua_failed': '🤖❌'
      };
      pipelineHTML = '<div style="display:flex;flex-direction:column;gap:6px;">';
      pipelineHTML += '<div style="color:#8b949e;font-size:13px;margin-bottom:4px;">项目: <span style="color:#58a6ff;font-weight:600;">' + activeTask.projectName + '</span> — ' + badge(activeTask.status) + '</div>';
      for (var pi = 0; pi < entries.length; pi++) {
        var e = entries[pi];
        var icon = statusIcons[e.status] || '▪';
        var ts = e.timestamp ? new Date(e.timestamp).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '-';
        var isLast = pi === entries.length - 1;
        var borderColor = isLast ? '#58a6ff' : '#30363d';
        var bgColor = isLast ? 'rgba(88,166,255,0.08)' : 'transparent';
        pipelineHTML += '<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-left:3px solid ' + borderColor + ';background:' + bgColor + ';border-radius:0 4px 4px 0;">';
        pipelineHTML += '<span style="color:#8b949e;font-size:12px;min-width:60px;">' + ts + '</span>';
        pipelineHTML += '<span style="font-size:14px;">' + icon + '</span>';
        pipelineHTML += '<span style="font-size:13px;color:#c9d1d9;">' + (e.message || e.status) + '</span>';
        if (e.workerId) pipelineHTML += '<span style="font-size:11px;color:#8b949e;margin-left:auto;">' + e.workerId + '</span>';
        pipelineHTML += '</div>';
      }
      pipelineHTML += '</div>';
    } else {
      pipelineHTML = '<div class="empty">暂无链路日志</div>';
    }
    document.getElementById('pipelineLog').innerHTML = pipelineHTML;

    // ========== Quality Gates ==========
    var q = stats.quality || {};
    var reviewTotal = (q.reviewPassed || 0) + (q.reviewFailed || 0);
    var reviewRate = reviewTotal > 0 ? Math.round(q.reviewPassed / reviewTotal * 100) : 0;
    var qtTotal = (q.quickTestPassed || 0) + (q.quickTestFailed || 0);
    var qtRate = qtTotal > 0 ? Math.round(q.quickTestPassed / qtTotal * 100) : 0;
    var cuaTotal = (q.cuaPassed || 0) + (q.cuaFailed || 0);
    var cuaRate = cuaTotal > 0 ? Math.round(q.cuaPassed / cuaTotal * 100) : 0;
    var qs = '';
    qs += statCard(reviewRate + '%', '代码审查通过率', reviewRate >= 80 ? 'green' : reviewRate >= 50 ? 'yellow' : 'red', '通过 ' + (q.reviewPassed || 0) + ' / 失败 ' + (q.reviewFailed || 0));
    qs += statCard(qtRate + '%', 'QuickTest 通过率', qtRate >= 80 ? 'green' : qtRate >= 50 ? 'yellow' : 'red', '通过 ' + (q.quickTestPassed || 0) + ' / 失败 ' + (q.quickTestFailed || 0));
    qs += statCard(cuaRate + '%', 'CUA 验证通过率', cuaRate >= 80 ? 'green' : cuaRate >= 50 ? 'yellow' : 'red', '通过 ' + (q.cuaPassed || 0) + ' / 失败 ' + (q.cuaFailed || 0));
    qs += statCard(q.avgCuaRounds || 0, '平均 CUA 轮数', (q.avgCuaRounds || 0) <= 2 ? 'green' : (q.avgCuaRounds || 0) <= 4 ? 'yellow' : 'red');
    document.getElementById('qualityStats').innerHTML = qs;

    // Quality detail table
    var qualityRows = rt.filter(function(t) { return t.reviewResult || t.quickTestResult || t.cuaResult; });
    if (qualityRows.length === 0) {
      document.getElementById('qualityDetail').innerHTML = '<div class="empty">暂无质量数据（任务完成后将自动显示）</div>';
    } else {
      document.getElementById('qualityDetail').innerHTML = tableHTML(
        ['项目', '审查', 'QuickTest', 'CUA', 'CUA轮数', '问题'],
        qualityRows.map(function(t) {
          var reviewBadge = t.reviewResult ? badge(t.reviewResult === 'pass' ? 'review_pass' : 'review_fail').replace('>' + (t.reviewResult === 'pass' ? 'review_pass' : 'review_fail') + '<', '>' + (t.reviewResult === 'pass' ? '✅ 通过' : '❌ 未通过') + '<') : '<span style="color:#484f58;">-</span>';
          var qtBadge = t.quickTestResult ? badge(t.quickTestResult === 'pass' ? 'quicktest_pass' : 'quicktest_fail').replace('>' + (t.quickTestResult === 'pass' ? 'quicktest_pass' : 'quicktest_fail') + '<', '>' + (t.quickTestResult === 'pass' ? '✅ 通过' : '❌ 未通过') + '<') : '<span style="color:#484f58;">-</span>';
          var cuaBadge = t.cuaResult ? badge(t.cuaResult === 'pass' ? 'cua_pass' : 'cua_fail').replace('>' + (t.cuaResult === 'pass' ? 'cua_pass' : 'cua_fail') + '<', '>' + (t.cuaResult === 'pass' ? '✅ 通过' : '❌ 未通过') + '<') : '<span style="color:#484f58;">-</span>';
          var issues = [];
          if (t.reviewResult === 'fail') issues.push('代码审查未通过');
          if (t.quickTestResult === 'fail') issues.push('纯色检测异常');
          if (t.cuaResult === 'fail') issues.push('CUA 验证失败');
          return [t.projectName, reviewBadge, qtBadge, cuaBadge, t.cuaRetries || '-', issues.length > 0 ? '<span style="color:#f85149;">' + issues.join('; ') + '</span>' : '<span style="color:#3fb950;">全部通过</span>'];
        })
      );
    }

    // ========== Workers ==========
    var ws = '';
    ws += statCard(stats.workers.total, '总 Workers', 'blue');
    ws += statCard(stats.workers.online, '在线', 'green');
    ws += statCard(stats.workers.offline, '离线', stats.workers.offline > 0 ? 'red' : 'gray');
    var busyWorkers = (stats.workers.list || []).filter(function(w) { return w.currentTask; }).length;
    ws += statCard(busyWorkers, '忙碌中', busyWorkers > 0 ? 'yellow' : 'gray');
    document.getElementById('workerStats').innerHTML = ws;

    document.getElementById('workerList').innerHTML = tableHTML(
      ['Worker ID', '状态', '当前任务', '最后心跳'],
      (stats.workers.list || []).map(function(w) {
        return [w.workerId, badge(w.status), w.currentTaskName || w.currentTask || '-', ago(w.lastHeartbeat)];
      })
    );

    // ========== Tasks ==========
    var ts2 = '';
    ts2 += statCard(stats.tasks.pending || 0, '等待中', 'yellow');
    ts2 += statCard((stats.tasks.processing || 0) + (stats.tasks.assigned || 0), '执行中', 'blue');
    ts2 += statCard(stats.tasks.completed || 0, '已完成', 'green');
    ts2 += statCard(stats.tasks.failed || 0, '失败', (stats.tasks.failed || 0) > 0 ? 'red' : 'gray');
    document.getElementById('taskStats').innerHTML = ts2;

    document.getElementById('taskList').innerHTML = tableHTML(
      ['项目', '状态', '消息', 'Worker', '进度', '创建时间', '更新时间'],
      rt.map(function(t) {
        var prog = t.progress ? t.progress + '%' : '-';
        return [t.projectName, badge(t.status), (t.statusMessage || '').slice(0, 40), t.workerId || '-', prog, fmt(t.createdAt), ago(t.updatedAt)];
      })
    );

    // ========== Parse Stats ==========
    var ps = '';
    ps += statCard(stats.parse.total, '总次数', 'blue');
    ps += statCard(stats.parse.success, '成功', 'green');
    ps += statCard(stats.parse.failed, '失败', (stats.parse.failed || 0) > 0 ? 'red' : 'gray');
    ps += statCard(stats.parse.avgTimeSec + 's', '平均耗时', 'blue');
    document.getElementById('parseStats').innerHTML = ps;

    var hist = stats.parse.recentHistory || [];
    if (hist.length === 0) {
      document.getElementById('parseHistory').innerHTML = '<div class="empty">暂无解析记录</div>';
    } else {
      var hh = '';
      hist.forEach(function(h) {
        var icon = h.success ? '✅' : '❌';
        var detail = h.success
          ? h.entities + ' 实体, ' + h.phases + ' 阶段, ' + Math.round(h.timeMs / 1000) + 's'
          : (h.error || '未知错误').slice(0, 60);
        hh += '<div class="history-item"><span class="icon">' + icon + '</span><span>' + detail + '</span><span class="time">' + ago(h.timestamp) + '</span></div>';
      });
      document.getElementById('parseHistory').innerHTML = hh;
    }

    // ========== Live Timeline ==========
    var liveHTML = '';
    var tasksWithTimeline = (stats.recentTasks || []).filter(function(t) { return t.timeline && t.timeline.length > 0; });
    if (tasksWithTimeline.length === 0) {
      liveHTML = '<div class="empty">暂无任务动态</div>';
    } else {
      tasksWithTimeline.forEach(function(t) {
        liveHTML += '<div class="card task-card">';
        liveHTML += '<div class="task-header">';
        liveHTML += '<span class="task-name">' + (t.projectName || t.taskId) + '</span>';
        liveHTML += badge(t.status);
        liveHTML += '</div>';
        liveHTML += '<div class="timeline">';
        // Show timeline entries (most recent first for readability, but render oldest first for visual flow)
        var entries = t.timeline.slice().reverse();
        entries.forEach(function(e, idx) {
          var cls = 'tl-item';
          var msg = e.message || e.status;
          if (e.status === 'failed' || msg.includes('failed')) cls += ' failed';
          else if (e.status === 'done' || e.status === 'cua_passed') cls += ' done';
          else if (e.status === 'building') cls += ' building';
          else if (msg.includes('AI fixing') || msg.includes('AI re-coding')) cls += ' fixing';
          else if (e.status === 'processing') cls += ' processing';
          else cls += ' ok';
          // Highlight the latest entry
          var isLatest = idx === 0;
          liveHTML += '<div class="' + cls + '">';
          liveHTML += '<div class="tl-msg">' + (isLatest ? '<strong>' : '') + msg + (isLatest ? '</strong>' : '') + '<span class="tl-status badge ' + e.status + '">' + e.status + '</span></div>';
          liveHTML += '<div class="tl-time">' + ago(e.timestamp) + (e.workerId ? ' · ' + e.workerId : '') + '</div>';
          liveHTML += '</div>';
        });
        liveHTML += '</div></div>';
      });
    }
    document.getElementById('liveTimelines').innerHTML = liveHTML;

    // ========== Pipeline Metrics ==========
    // Restore auto-fix button states from server (survives page refresh)
    var serverPending = (pipelineMetrics && pipelineMetrics.pendingCommits) || {};
    for (var pendKey in serverPending) {
      if (!_autoFixStates[pendKey]) {
        var sp = serverPending[pendKey];
        var serverState = sp.state || 'done';
        _autoFixStates[pendKey] = serverState;
        if (serverState === 'done') _autoFixResults[pendKey] = sp;
        if (serverState === 'error') _autoFixErrors[pendKey] = sp.error || 'unknown';
      }
    }
    var pm = pipelineMetrics && pipelineMetrics.pipeline;
    if (pm && pm.totalRuns > 0) {
      var pt = '';
      var srColor = parseFloat(pm.successRate) >= 50 ? 'green' : parseFloat(pm.successRate) >= 20 ? 'yellow' : 'red';
      pt += statCard(pm.successRate, '成功率', srColor, pm.successCount + ' 成功 / ' + pm.failCount + ' 失败');
      pt += statCard(pm.totalRuns, '总运行次数', 'blue');
      pt += statCard(pm.avgDurationMin + 'm', '平均耗时', 'blue');
      var bn = pm.bottleneckStage;
      pt += statCard(bn ? bn.stage : '-', '瓶颈 Stage', 'yellow', bn ? '平均 ' + bn.avgRounds + ' 轮' : '');
      document.getElementById('pipelineTopStats').innerHTML = pt;

      // Failure hotspots bar chart
      var hotspots = pm.failureHotspots || [];
      if (hotspots.length > 0) {
        var maxCount = hotspots[0].count;
        var hh = '';
        hotspots.forEach(function(h) {
          var pct = maxCount > 0 ? Math.round(h.count / maxCount * 100) : 0;
          hh += '<div style="margin-bottom:10px;">';
          hh += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>' + h.stage + '</span><span style="color:#8b949e;">' + h.count + '次 (' + h.pct + ')</span></div>';
          hh += '<div style="background:#21262d;border-radius:4px;height:8px;overflow:hidden;"><div style="background:#f85149;height:100%;width:' + pct + '%;border-radius:4px;transition:width 0.3s;"></div></div>';
          hh += '</div>';
        });
        document.getElementById('failureHotspots').innerHTML = hh;
      } else {
        document.getElementById('failureHotspots').innerHTML = '<div class="empty">无失败记录 🎉</div>';
      }

      // Stage pass rates
      var spr = pm.stagePassRates || {};
      var sprKeys = Object.keys(spr);
      if (sprKeys.length > 0) {
        var sh = '';
        sprKeys.forEach(function(k) {
          var s = spr[k];
          var rate = parseInt(s.rate);
          var barColor = rate >= 80 ? '#3fb950' : rate >= 50 ? '#d29922' : '#f85149';
          sh += '<div style="margin-bottom:10px;">';
          sh += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>' + k + '</span><span style="color:#8b949e;">' + s.rate + ' (' + s.passed + '/' + s.attempted + ')</span></div>';
          sh += '<div style="background:#21262d;border-radius:4px;height:8px;overflow:hidden;"><div style="background:' + barColor + ';height:100%;width:' + rate + '%;border-radius:4px;transition:width 0.3s;"></div></div>';
          sh += '</div>';
        });
        document.getElementById('stagePassRates').innerHTML = sh;
      } else {
        document.getElementById('stagePassRates').innerHTML = '<div class="empty">暂无数据</div>';
      }

      // Data window indicator — show the time range of the records so
      // pre-fix stale data is visually obvious instead of masquerading as
      // "current state".
      var dw = pm.dataWindow;
      if (dw && dw.from && dw.to) {
        var fromStr = fmt(new Date(dw.from).getTime());
        var toStr = fmt(new Date(dw.to).getTime());
        var ageHours = Math.round((Date.now() - new Date(dw.to).getTime()) / 3600000);
        var staleTag = ageHours > 6 ? ' <span style="color:#d29922;">⚠️ 数据 ' + ageHours + 'h 未更新</span>' : '';
        document.getElementById('pipelineDataWindow').innerHTML = '数据范围: ' + fromStr + ' → ' + toStr + staleTag;
      } else {
        document.getElementById('pipelineDataWindow').innerHTML = '';
      }

      // Top failure fingerprints — new schema: fingerprint / uniqueTasks /
      // retries / firstSeen / lastSeen / knowledge binding badge / auto-fix
      // button. Retries count is shown in a muted color to prevent the
      // "19 retries of 1 stuck task" inflation bug from recurring.
      var tfr = pm.topFailReasons || [];
      if (tfr.length > 0) {
        var fh = '<table style="width:100%;"><thead><tr>';
        fh += '<th>状态</th><th>指纹</th><th style="text-align:right;">tasks</th><th style="text-align:right;">retries</th><th>stage</th><th>最近</th><th>操作</th>';
        fh += '</tr></thead><tbody>';
        tfr.forEach(function(r) {
          var kb = r.knowledge || {};
          var badgeHTML, badgeTitle;
          if (kb.resolvedBy) {
            badgeHTML = '<span style="color:#3fb950;" title="已修复 ' + (kb.resolvedBy || '') + '">🟢</span>';
            badgeTitle = '已修复 ' + (kb.resolvedBy || '').slice(0, 7);
          } else if ((kb.memoryHits || []).length > 0 || (kb.commitHits || []).length > 0) {
            badgeHTML = '<span style="color:#d29922;" title="已知但未修复">🟡</span>';
            badgeTitle = '已知未修';
          } else {
            badgeHTML = '<span style="color:#f85149;" title="未分类">🔴</span>';
            badgeTitle = '未分类';
          }
          var mem = (kb.memoryHits || []).slice(0, 2).map(function(m) { return m.file; }).join(', ');
          var commit = (kb.commitHits || []).slice(0, 1).map(function(c) { return c.hash.slice(0, 7) + ' ' + c.subject.slice(0, 40); }).join('');
          var knowledgeCell = [badgeHTML, badgeTitle, mem ? '<br><span style="color:#8b949e;font-size:11px;">mem: ' + mem + '</span>' : '', commit ? '<br><span style="color:#8b949e;font-size:11px;">git: ' + commit + '</span>' : ''].join(' ');
          var fpShort = (r.fingerprint || r.sampleReason || '').slice(0, 80);
          var lastSeenAgo = r.lastSeen ? ago(new Date(r.lastSeen).getTime()) : '-';
          var recipeId = kb.autoFixRecipe ? kb.autoFixRecipe.id : null;
          var btnId = 'af-' + (recipeId || '').replace(/[^a-zA-Z0-9-]/g, '');
          var canAutoFix;
          var afState = recipeId ? (_autoFixStates[recipeId] || null) : null;
          if (!recipeId) {
            canAutoFix = '<span style="color:#484f58;font-size:11px;">无 recipe</span>';
          } else if (afState === 'committed') {
            var hash = _autoFixCommitHashes[recipeId] || '';
            canAutoFix = '<span id="' + btnId + '"><span style="color:#3fb950;font-size:11px;">已提交 ' + hash + '</span></span>';
          } else if (afState === 'done') {
            canAutoFix = '<span id="' + btnId + '"><button onclick="showAutoFixApproval(\'' + recipeId + '\')" style="background:#238636;color:#fff;border:0;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;">批准 commit</button></span>';
          } else if (afState === 'loading') {
            canAutoFix = '<span id="' + btnId + '"><button disabled style="background:#30363d;color:#8b949e;border:1px solid #30363d;padding:4px 10px;border-radius:4px;cursor:wait;font-size:11px;">修复中...</button></span>';
          } else if (afState === 'error') {
            var errMsg = (_autoFixErrors[recipeId] || '').replace(/"/g, '&quot;').slice(0, 120);
            canAutoFix = '<span id="' + btnId + '"><button disabled style="background:#da3633;color:#fff;border:0;padding:4px 10px;border-radius:4px;cursor:not-allowed;font-size:11px;" title="' + errMsg + '">失败</button></span>';
          } else if (kb.resolvedBy) {
            canAutoFix = '<span id="' + btnId + '"><button disabled style="background:#30363d;color:#484f58;border:1px solid #30363d;padding:4px 10px;border-radius:4px;cursor:not-allowed;font-size:11px;" title="已修复 ' + (kb.resolvedBy || '').slice(0, 7) + '">已修复</button></span>';
          } else {
            canAutoFix = '<span id="' + btnId + '"><button onclick="triggerAutoFix(\'' + recipeId + '\',\'' + btnId + '\')" style="background:#1f6feb;color:#fff;border:0;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;">自动修复</button></span>';
          }
          fh += '<tr>';
          fh += '<td>' + knowledgeCell + '</td>';
          fh += '<td style="word-break:break-all;max-width:420px;">' + fpShort + '</td>';
          fh += '<td style="text-align:right;font-weight:700;color:#f85149;">' + r.uniqueTasks + '</td>';
          fh += '<td style="text-align:right;color:#8b949e;">' + r.retries + '</td>';
          fh += '<td>' + r.failedAtStage + '</td>';
          fh += '<td>' + lastSeenAgo + '</td>';
          fh += '<td>' + canAutoFix + '</td>';
          fh += '</tr>';
        });
        fh += '</tbody></table>';
        document.getElementById('topFailReasons').innerHTML = fh;
      } else {
        document.getElementById('topFailReasons').innerHTML = '<div class="empty">无失败记录 🎉</div>';
      }

      // Trend + classification
      var trendHTML = '';
      if (pm.trend) {
        var dirIcon = pm.trend.direction === 'improving' ? '📈' : pm.trend.direction === 'declining' ? '📉' : '➡️';
        var dirColor = pm.trend.direction === 'improving' ? '#3fb950' : pm.trend.direction === 'declining' ? '#f85149' : '#8b949e';
        trendHTML += '<div style="padding:12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;margin-bottom:12px;">';
        trendHTML += '<div style="font-size:13px;margin-bottom:8px;">趋势 ' + dirIcon + ' <span style="color:' + dirColor + ';font-weight:600;">' + pm.trend.direction + '</span></div>';
        trendHTML += '<div style="display:flex;gap:20px;font-size:12px;">';
        trendHTML += '<span>最近 5 次: <strong>' + pm.trend.recent5SuccessRate + '</strong></span>';
        trendHTML += '<span>之前 5 次: <strong>' + pm.trend.previous5SuccessRate + '</strong></span>';
        trendHTML += '</div></div>';
      }
      var fc = pm.failureClassifications || {};
      var fcKeys = Object.keys(fc);
      if (fcKeys.length > 0) {
        trendHTML += '<h3 style="font-size:12px;color:#8b949e;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">错误分类</h3>';
        trendHTML += '<div style="display:flex;gap:12px;flex-wrap:wrap;">';
        var classColors = { CODE: '#d29922', INFRA: '#58a6ff', FATAL: '#f85149', GATE: '#bc8cff', UNKNOWN: '#8b949e' };
        fcKeys.forEach(function(k) {
          var c = classColors[k] || '#8b949e';
          trendHTML += '<div style="background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 16px;text-align:center;">';
          trendHTML += '<div style="font-size:22px;font-weight:700;color:' + c + ';">' + fc[k] + '</div>';
          trendHTML += '<div style="font-size:11px;color:#8b949e;margin-top:2px;">' + k + '</div>';
          trendHTML += '</div>';
        });
        trendHTML += '</div>';
      }
      document.getElementById('pipelineTrend').innerHTML = trendHTML || '<div class="empty">需要 10+ 次运行后显示趋势</div>';

    } else {
      document.getElementById('pipelineTopStats').innerHTML = statCard('-', '总运行次数', 'gray', '尚无 Pipeline 运行数据');
      document.getElementById('failureHotspots').innerHTML = '<div class="empty">Pipeline 运行后将自动采集数据</div>';
      document.getElementById('stagePassRates').innerHTML = '<div class="empty">Pipeline 运行后将自动采集数据</div>';
      document.getElementById('topFailReasons').innerHTML = '<div class="empty">Pipeline 运行后将自动采集数据</div>';
      document.getElementById('pipelineTrend').innerHTML = '<div class="empty">Pipeline 运行后将自动采集数据</div>';
      document.getElementById('pipelineDataWindow').innerHTML = '';
    }

    // Regression alerts — populated by L3 watchdog. Each entry is a fingerprint
    // that was marked resolved by a past commit but reappeared in fresh metrics.
    var regs = (pipelineMetrics && pipelineMetrics.regressions) || [];
    if (regs.length > 0) {
      var rh = '';
      regs.forEach(function(rg) {
        rh += '<div style="padding:10px;background:#2d1113;border:1px solid #f8514933;border-radius:6px;margin-bottom:8px;">';
        rh += '<div style="color:#f85149;font-weight:600;font-size:13px;">🚨 ' + (rg.fingerprint || 'unknown').slice(0, 80) + '</div>';
        rh += '<div style="font-size:11px;color:#8b949e;margin-top:4px;">之前由 <code>' + (rg.resolvedBy || '').slice(0, 7) + '</code> 修复 · 再次出现 ' + ago(new Date(rg.regressedAt).getTime()) + ' · 命中 ' + rg.count + ' 次</div>';
        rh += '</div>';
      });
      document.getElementById('regressionAlerts').innerHTML = rh;
    } else {
      document.getElementById('regressionAlerts').innerHTML = '<div class="empty">无回归告警 ✅</div>';
    }

    // Project failures table
    var pf = pipelineMetrics && pipelineMetrics.projectFailures || [];
    if (pf.length > 0) {
      document.getElementById('projectFailures').innerHTML = tableHTML(
        ['项目', '状态', '失败 Stage', '错误分类', '失败原因', '失败次数', '时间'],
        pf.map(function(p) {
          var lf = p.lastFailure || {};
          return [
            p.projectName || p.projectId,
            badge(p.status),
            lf.failedAtStage ? '<span style="color:#f85149;font-weight:500;">' + lf.failedAtStage + '</span>' : '-',
            lf.failClassification ? badge(lf.failClassification === 'CODE' ? 'pending' : lf.failClassification === 'INFRA' ? 'processing' : 'failed').replace('>' + (lf.failClassification === 'CODE' ? 'pending' : lf.failClassification === 'INFRA' ? 'processing' : 'failed') + '<', '>' + lf.failClassification + '<') : '-',
            lf.failReason ? '<span style="font-size:12px;color:#c9d1d9;">' + (lf.failReason || '').substring(0, 80) + '</span>' : '-',
            '<span style="font-weight:600;' + (p.failureCount > 3 ? 'color:#f85149;' : '') + '">' + (p.failureCount || 0) + '</span>',
            lf.failedAt ? ago(new Date(lf.failedAt).getTime()) : '-'
          ];
        })
      );
    } else {
      document.getElementById('projectFailures').innerHTML = '<div class="empty">暂无项目失败记录</div>';
    }
  }

  // Auto-fix state tracking — survives refresh() rebuilds
  // States: null → 'loading' → 'done'/'error' → 'committed'
  var _autoFixStates = {};       // recipeId → state string
  var _autoFixResults = {};      // recipeId → API result
  var _autoFixErrors = {};       // recipeId → error message
  var _autoFixCommitHashes = {}; // recipeId → commit hash

  window.triggerAutoFix = function(recipeId, btnId) {
    _autoFixStates[recipeId] = 'loading';
    // Immediately update the button in DOM
    var container = document.getElementById(btnId);
    if (container) container.innerHTML = '<button disabled style="background:#30363d;color:#8b949e;border:1px solid #30363d;padding:4px 10px;border-radius:4px;cursor:wait;font-size:11px;">修复中...</button>';
    fetch(BASE + '/api/auto-fix/' + encodeURIComponent(recipeId), { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(result) {
        if (result.error) {
          _autoFixStates[recipeId] = 'error';
          _autoFixErrors[recipeId] = result.error;
          return;
        }
        _autoFixStates[recipeId] = 'done';
        _autoFixResults[recipeId] = result;
      })
      .catch(function(err) {
        _autoFixStates[recipeId] = 'error';
        _autoFixErrors[recipeId] = err.message || 'network error';
      });
  };

  // 3. Modal for reviewing + committing
  window.showAutoFixApproval = function(recipeId) {
    var result = _autoFixResults[recipeId];
    if (!result) return;
    // Remove existing modal
    var old = document.getElementById('autofix-modal');
    if (old) old.remove();
    // Build modal
    var esc = function(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
    var files = (result.filesChanged || []).join(', ') || '(none)';
    var diag = result.diagnosis || '(no diagnosis)';
    var modal = document.createElement('div');
    modal.id = 'autofix-modal';
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;';
    modal.innerHTML = '<div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow:auto;">'
      + '<h3 style="margin:0 0 16px;color:#c9d1d9;">Auto-fix: ' + esc(recipeId) + '</h3>'
      + '<div style="margin-bottom:12px;"><span style="color:#8b949e;">Recipe:</span> <span style="color:#c9d1d9;">' + esc(result.recipe || recipeId) + '</span></div>'
      + '<div style="margin-bottom:12px;"><span style="color:#8b949e;">修改文件:</span> <span style="color:#58a6ff;">' + esc(files) + '</span></div>'
      + '<div style="margin-bottom:12px;"><span style="color:#8b949e;">诊断:</span></div>'
      + '<pre style="background:#0d1117;padding:12px;border-radius:6px;overflow:auto;max-height:300px;color:#c9d1d9;font-size:12px;white-space:pre-wrap;">' + esc(diag) + '</pre>'
      + '<div style="margin-top:20px;display:flex;gap:12px;justify-content:flex-end;">'
      + '<button onclick="document.getElementById(\'autofix-modal\').remove()" style="background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:8px 16px;border-radius:6px;cursor:pointer;">取消</button>'
      + '<button id="autofix-commit-btn" onclick="commitAutoFix(\'' + recipeId + '\')" style="background:#238636;color:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;">提交 commit</button>'
      + '</div></div>';
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
  };

  // 4. Commit
  window.commitAutoFix = function(recipeId) {
    var result = _autoFixResults[recipeId];
    if (!result) return;
    var btn = document.getElementById('autofix-commit-btn');
    if (btn) { btn.disabled = true; btn.textContent = '提交中...'; btn.style.cursor = 'wait'; btn.style.background = '#30363d'; }
    fetch(BASE + '/api/auto-fix-commit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recipeId: recipeId, filesChanged: result.filesChanged || [], diagnosis: result.diagnosis || '' }),
    })
      .then(function(r) { return r.json(); })
      .then(function(commitResult) {
        var modal = document.getElementById('autofix-modal');
        if (commitResult.error) {
          if (btn) { btn.textContent = '失败'; btn.style.background = '#da3633'; }
          alert('Commit 失败: ' + commitResult.error);
          return;
        }
        // Success — update state (next refresh will render correctly)
        _autoFixStates[recipeId] = 'committed';
        _autoFixCommitHashes[recipeId] = commitResult.commitHash || '';
        if (modal) modal.remove();
        // Also update DOM immediately
        var afBtn = document.getElementById('af-' + recipeId.replace(/[^a-zA-Z0-9-]/g, ''));
        if (afBtn) afBtn.innerHTML = '<span style="color:#3fb950;font-size:11px;">已提交 ' + (commitResult.commitHash || '') + '</span>';
      })
      .catch(function(err) {
        if (btn) { btn.textContent = '失败'; btn.style.background = '#da3633'; }
        alert('请求失败: ' + err.message);
      });
  };

  refresh();
  // Live tab refreshes faster (5s)
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
